[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-neural-net-inference"
version = "2.0.0"
description = "HE-NeuralInference: Polynomial Activation Encrypted Medical Classifier Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
homomorphic-neural-net-inference = "he_neural_inference.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-neural-net-inference"
Repository = "https://github.com/abusuraihsakhri/homomorphic-neural-net-inference.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "he_neural_inference*"]
