name: Test and security regression checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python source
        run: python -m compileall -q agents he_neural_inference cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser rule engine
        run: node --test web/app.test.cjs
      - name: Audit integrity smoke test
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
